<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexPlay Officiel</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #ff0000;
      --accent-discord: #5865F2;
      --accent-green: #2ea44f;
      --accent-blue: #0284c7;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 25px;
    }

    /* Badges / Buttons Header */
    .badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 6px;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .badge-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .btn-youtube { background-color: var(--accent-red); }
    .btn-discord { background-color: var(--accent-discord); }
    .btn-shop { background-color: var(--accent-blue); }
    .btn-ia { background-color: var(--accent-green); }

    /* Sections */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      font-size: 1.4rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    ul {
      padding-left: 20px;
      line-height: 1.6;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Secret / Hidden Accordion */
    details {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px 16px;
      margin: 15px 0;
    }
